services:
  backend:
    environment:
      TABLEPLAN_TRANSLATION_PROVIDER: libretranslate
      TABLEPLAN_TRANSLATION_BASE_URL: http://libretranslate:5000
      TABLEPLAN_TRANSLATION_CONNECT_TIMEOUT_MS: "1200"
      TABLEPLAN_TRANSLATION_CHECK_TIMEOUT_MS: "1500"
      TABLEPLAN_TRANSLATION_TIMEOUT_MS: "8000"
      TABLEPLAN_TRANSLATION_RETRY_MS: "5000"
      TABLEPLAN_TRANSLATION_CACHE_SIZE: "30000"

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,de,fr,it
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "4"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 30
      start_period: 20s
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw

volumes:
  libretranslate-models:

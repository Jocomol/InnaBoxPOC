spring:
  application:
    name: catering-planner
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/catering}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  packages-to-scan: ch.inabox.catering.controller
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
